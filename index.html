
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreativeStudio</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/script.js" defer></script>
</head>
<body>
  <header class="l-header">
    <h1>CreativeStudio</h1>
    <nav>
      <a href="#about">ABOUT</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <main>
    <section class="p-hero">
      <p class="p-hero__label">DESIGN YOUR IDEAS</p>
      <h2>アイデアを、カタチに。</h2>
      <p>CreativeStudioのWebサイトへようこそ。</p>
      <button class="c-button" id="js-messageButton">
        メッセージを表示
      </button>
      <p id="js-message" aria-live="polite"></p>
    </section>

    <section class="p-about" id="about">
      <h2>ABOUT</h2>
      <p>デザインとテクノロジーで、新しい可能性をつくります。</p>
    </section>

    <section class="p-contact" id="contact">
      <h2>CONTACT</h2>
      <p>お問い合わせはこちらから。</p>
    </section>
  </main>

  <footer class="l-footer">
    <p>&copy; 2026 CreativeStudio</p>
  </footer>
</body>
</html>
